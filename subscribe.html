<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="canonical" href="https://tools.you-the-winner.com/subscribe" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Subscribe · Daily Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a7d6f'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-weight='800' font-size='20' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<!--
  subscribe.html — REBUILT 2026-09-05.

  This used to be a design-only preview of the old Base + independent
  add-on packs pricing model (fake setTimeout "Redirecting..." step, never
  actually wired to Stripe -- see SUBSCRIPTION-ARCHITECTURE.md history).
  That pricing model is retired. Marcelo decided the new marketing site
  (You-The-Winner marketing/pricing.html) is the pricing model that
  prevails: flat plan tiers -- Personal, Family, Professional Pro -- each
  a single Stripe Price per interval. Organization is a custom,
  sales-assisted tier with no self-serve checkout, so it's not offered
  here. Professional Supporter is free (rides on this app's existing
  family/caregiver sharing invite, not a Stripe purchase), so it's not
  offered here either.

  This page is now the REAL checkout handoff, not a preview:
    1. Reads ?plan=personal|family|pro&interval=month|year from the URL
       (the marketing site's pricing.html buttons link here with those
       params). If missing/invalid, shows an inline plan chooser instead
       of requiring the marketing site to be live.
    2. Gates on Firebase sign-in (same Google-only auth as login.html,
       same 'guard' named app instance so this can share auth state with
       every other page, same denylist check so a denylisted account can't
       reach checkout here either).
    3. POSTs {uid, email, interval, plan} to
       /.netlify/functions/create-checkout-session and redirects the
       browser to the real Stripe-hosted Checkout url it returns. That
       function already sets client_reference_id and
       subscription_data.metadata.firebaseUid, so stripe-webhook.js can
       attribute the resulting subscription back to this account -- see
       that function's header comment for why the marketing site's old
       static buy.stripe.com Payment Links couldn't do this at all.

  Prices below are display-only copies of the real Stripe Prices (kept in
  sync by hand with pricing.html and with the STRIPE_PRICE_* Netlify env
  vars create-checkout-session.js reads) -- this page never charges an
  amount itself, Stripe Checkout always charges whatever the actual Price
  object says.
-->
<style>
  :root {
    --bg: #f0f5f3; --surface: #ffffff; --surface2: #e8f0ed;
    --border: #cfddd8; --text: #0f1f1c; --muted: #5a7a73;
    --soft: #a8c4bc; --accent: #2a7d6f; --accent2: #1a5c7a;
    --accent-light: #e0eeea; --error: #c0392b; --error-bg: #fdf0ef;
    --gold: #c99a2e; --gold-bg: #fbf3e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh; padding: 24px;
  }
  .wrap { width: 100%; max-width: 920px; margin: 0 auto; }
  .narrow { max-width: 380px; margin: 0 auto; }

  .monogram {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; margin: 40px auto 20px;
  }
  .monogram span {
    font-family: 'Nunito', sans-serif; font-size: 1.6rem;
    font-weight: 800; color: white; line-height: 1;
  }
  .heading {
    font-family: 'Nunito', sans-serif; font-size: 1.5rem;
    font-weight: 800; text-align: center; margin-bottom: 4px;
  }
  .sub { font-size: 0.82rem; color: var(--muted); text-align: center; margin-bottom: 28px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px;
  }

  .btn {
    width: 100%; background: var(--accent); color: white;
    border: none; border-radius: 10px; padding: 13px;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem;
    font-weight: 700; cursor: pointer; transition: all 0.2s;
    margin-top: 4px;
  }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .google-btn {
    width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    font-family: 'Quicksand', sans-serif; font-size: 0.92rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .google-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .google-btn img { width: 18px; height: 18px; }

  .error-box {
    background: var(--error-bg); border: 1px solid #f5c6c4;
    border-radius: 10px; padding: 10px 14px;
    font-size: 0.82rem; color: var(--error);
    margin-bottom: 14px; display: none;
  }
  .error-box.show { display: block; }
  .notice-box {
    background: var(--gold-bg); border: 1px solid #ecd9a8;
    border-radius: 10px; padding: 10px 14px;
    font-size: 0.82rem; color: #7a5c10;
    margin-bottom: 14px; display: none;
  }
  .notice-box.show { display: block; }

  .footer-note {
    text-align: center; font-size: 0.72rem; color: var(--soft);
    margin-top: 20px; letter-spacing: 0.5px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }

  /* Interval toggle */
  .interval-toggle {
    display: flex; justify-content: center; gap: 8px; margin-bottom: 26px;
  }
  .interval-btn {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 18px; font-size: 0.82rem;
    font-weight: 700; color: var(--muted); cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .interval-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .interval-btn small { display: block; font-weight: 500; font-size: 0.65rem; opacity: .85; }

  /* Plan chooser grid */
  .plans-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px; margin-bottom: 10px;
  }
  .plan-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 20px; position: relative;
  }
  .plan-card.popular { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
  .plan-popular-badge {
    position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; font-size: 0.62rem; font-weight: 800;
    letter-spacing: .6px; padding: 4px 10px; border-radius: 999px;
    font-family: 'Nunito', sans-serif;
  }
  .plan-name { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; margin-bottom: 4px; }
  .plan-price { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.6rem; }
  .plan-price small { font-size: .78rem; font-weight: 600; color: var(--muted); }
  .plan-save { font-size: .72rem; color: var(--accent); font-weight: 700; margin: 2px 0 14px; min-height: 1em; }

  /* Confirm card (deep-linked from marketing site with ?plan&interval) */
  .confirm-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .confirm-plan { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.15rem; }
  .confirm-price { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1.15rem; }
  .confirm-sub { font-size: .78rem; color: var(--muted); margin-bottom: 20px; }
  .signed-in-text { text-align: center; font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
  .change-plan-link { text-align: center; font-size: 0.76rem; color: var(--muted); text-decoration: underline; cursor: pointer; margin-top: 14px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>

<div class="wrap">
  <div class="monogram"><span>M</span></div>
  <div class="heading">Daily Tools subscription</div>
  <p class="sub">Choose the plan that matches how you'll use it.</p>

  <div class="narrow">
    <div class="error-box" id="error-box"></div>
    <div class="notice-box" id="canceled-notice">Checkout was canceled — you can pick a plan and try again anytime.</div>
  </div>

  <!-- Plan chooser: shown when the URL has no valid ?plan -->
  <div id="chooser-view">
    <div class="interval-toggle">
      <button class="interval-btn active" id="int-month-btn" onclick="selectInterval('month')">Monthly</button>
      <button class="interval-btn" id="int-year-btn" onclick="selectInterval('year')">Annual<small>save 2 months</small></button>
    </div>
    <div class="plans-grid" id="plans-grid"></div>
  </div>

  <!-- Confirm + sign-in view: shown once a plan is chosen (or deep-linked) -->
  <div id="confirm-view" class="narrow" hidden>
    <div class="card">
      <div class="confirm-row">
        <span class="confirm-plan" id="confirm-plan-name"></span>
        <span class="confirm-price" id="confirm-plan-price"></span>
      </div>
      <div class="confirm-sub" id="confirm-plan-sub"></div>

      <div id="signed-out-block">
        <button class="google-btn" id="google-btn" onclick="signInAndCheckout()">
          <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' width='18' height='18'%3E%3Cpath fill='%23FFC107' d='M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z'/%3E%3Cpath fill='%23FF3D00' d='M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z'/%3E%3Cpath fill='%234CAF50' d='M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z'/%3E%3Cpath fill='%231976D2' d='M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z'/%3E%3C/svg%3E" alt="" />
          <span id="google-btn-label">Continue with Google to subscribe</span>
        </button>
      </div>

      <div id="signed-in-block" hidden>
        <p class="signed-in-text">Signed in as <strong id="signed-in-email"></strong></p>
        <button class="btn" id="checkout-btn" onclick="startCheckout()">Continue to secure checkout</button>
      </div>
    </div>
    <p class="change-plan-link" onclick="backToChooser()">Choose a different plan</p>
  </div>

  <p class="footer-note">Payment is handled by Stripe — Daily Tools never sees or stores your card details.</p>
</div>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { CLIENT } from "./client.config.js";

  const FB_CONFIG = CLIENT.firebase;
  const app  = getApps().find(a => a.name === 'guard') || initializeApp(FB_CONFIG, 'guard');
  const auth = getAuth(app);
  const db   = getDatabase(app);

  try { await setPersistence(auth, browserLocalPersistence); } catch (e) { console.warn('[subscribe] setPersistence failed:', e); }

  // Display-only copies of the real Stripe Prices -- keep in sync by hand
  // with pricing.html and with the STRIPE_PRICE_* Netlify env vars.
  const PLANS = {
    personal: { key: 'personal', label: 'Personal',           monthly: 9.99,  annual: 99,  save: 20.88, popular: false, blurb: 'For one person using Daily Tools day to day.' },
    family:   { key: 'family',   label: 'Family',              monthly: 19.99, annual: 199, save: 40.88, popular: true,  blurb: 'Everything in Personal, plus family/supporter collaboration.' },
    pro:      { key: 'pro',      label: 'Professional Pro',    monthly: 29,    annual: 290, save: 58,    popular: false, blurb: 'For a professional managing multiple client relationships.' },
  };
  const money = (n) => '$' + (Number.isInteger(n) ? n : n.toFixed(2));

  let state = { interval: 'month', plan: null };

  const errorBox      = document.getElementById('error-box');
  const canceledNotice= document.getElementById('canceled-notice');
  const chooserView   = document.getElementById('chooser-view');
  const confirmView   = document.getElementById('confirm-view');
  const plansGrid     = document.getElementById('plans-grid');
  const signedOutBlock= document.getElementById('signed-out-block');
  const signedInBlock = document.getElementById('signed-in-block');
  const signedInEmail = document.getElementById('signed-in-email');
  const googleBtn     = document.getElementById('google-btn');
  const checkoutBtn   = document.getElementById('checkout-btn');

  function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
  function hideError() { errorBox.classList.remove('show'); errorBox.textContent = ''; }

  function renderPlansGrid() {
    plansGrid.innerHTML = '';
    Object.values(PLANS).forEach(function(p) {
      const price = state.interval === 'year' ? p.annual : p.monthly;
      const div = document.createElement('div');
      div.className = 'plan-card' + (p.popular ? ' popular' : '');
      div.innerHTML =
        (p.popular ? '<div class="plan-popular-badge">MOST POPULAR</div>' : '') +
        '<div class="plan-name">' + p.label + '</div>' +
        '<div class="plan-price">' + money(price) + ' <small>/' + (state.interval === 'year' ? 'year' : 'month') + '</small></div>' +
        '<div class="plan-save">' + (state.interval === 'year' ? 'Save ' + money(p.save) + '/year' : '&nbsp;') + '</div>' +
        '<button class="btn">Choose ' + p.label + '</button>';
      div.querySelector('button').onclick = function() { choosePlan(p.key); };
      plansGrid.appendChild(div);
    });
  }

  window.selectInterval = function(interval) {
    state.interval = interval;
    document.getElementById('int-month-btn').classList.toggle('active', interval === 'month');
    document.getElementById('int-year-btn').classList.toggle('active', interval === 'year');
    renderPlansGrid();
  };

  function showConfirm(planKey) {
    const p = PLANS[planKey];
    if (!p) return;
    state.plan = planKey;
    const price = state.interval === 'year' ? p.annual : p.monthly;
    document.getElementById('confirm-plan-name').textContent = p.label;
    document.getElementById('confirm-plan-price').textContent = money(price) + '/' + (state.interval === 'year' ? 'yr' : 'mo');
    document.getElementById('confirm-plan-sub').textContent = p.blurb;
    chooserView.hidden = true;
    confirmView.hidden = false;
    hideError();
  }

  window.choosePlan = function(planKey) { showConfirm(planKey); };
  window.backToChooser = function() {
    confirmView.hidden = true;
    chooserView.hidden = false;
    hideError();
  };

  window.signInAndCheckout = async function() {
    hideError();
    googleBtn.disabled = true;
    const label = document.getElementById('google-btn-label');
    if (label) label.innerHTML = '<span class="spinner"></span>Signing in…';
    const provider = new GoogleAuthProvider();
    try {
      const result = await signInWithPopup(auth, provider);
      const email = (result.user.email || '').toLowerCase();
      if (email !== CLIENT.primaryAdminEmail) {
        const snap = await get(ref(db, CLIENT.dbRootPath + '/denylist'));
        const list = snap.val();
        const denied = Array.isArray(list) && list.map(function(e){ return String(e).toLowerCase(); }).includes(email);
        if (denied) {
          await signOut(auth);
          showError("This account doesn't have access. Contact the site owner if you think this is a mistake.");
          googleBtn.disabled = false;
          if (label) label.textContent = 'Continue with Google to subscribe';
          return;
        }
      }
      // onAuthStateChanged below flips the UI to the signed-in block.
    } catch (err) {
      console.warn('[subscribe] sign-in error:', err);
      googleBtn.disabled = false;
      if (label) label.textContent = 'Continue with Google to subscribe';
      showError(err && err.code === 'auth/popup-closed-by-user' ? 'Sign-in was closed before finishing. Please try again.' : 'Sign-in failed. Please try again.');
    }
  };

  window.startCheckout = async function() {
    hideError();
    const user = auth.currentUser;
    if (!user || !state.plan) return;
    checkoutBtn.disabled = true;
    checkoutBtn.innerHTML = '<span class="spinner"></span>Redirecting to secure checkout…';
    try {
      const resp = await fetch('/.netlify/functions/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: user.uid, email: user.email, interval: state.interval, plan: state.plan }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.url) {
        throw new Error(data && data.error ? data.error : 'Could not start checkout.');
      }
      window.location.href = data.url;
    } catch (err) {
      console.error('[subscribe] checkout error:', err);
      checkoutBtn.disabled = false;
      checkoutBtn.textContent = 'Continue to secure checkout';
      showError(err.message || 'Could not start checkout. Please try again.');
    }
  };

  onAuthStateChanged(auth, function(user) {
    if (user) {
      signedOutBlock.hidden = true;
      signedInBlock.hidden = false;
      signedInEmail.textContent = user.email || '';
      // If a sign-in just completed from signInAndCheckout(), move straight
      // into checkout rather than making the person click twice.
      if (state.plan && state._autoCheckoutPending) {
        state._autoCheckoutPending = false;
        window.startCheckout();
      }
    } else {
      signedOutBlock.hidden = false;
      signedInBlock.hidden = true;
    }
  });

  // Wrap signInAndCheckout so a successful sign-in auto-continues to
  // checkout instead of requiring a second click on "Continue to secure
  // checkout" -- the onAuthStateChanged handler above checks this flag.
  const _origSignIn = window.signInAndCheckout;
  window.signInAndCheckout = function() {
    state._autoCheckoutPending = true;
    return _origSignIn();
  };

  // ---- Entry point: parse the URL and decide chooser vs. confirm view ----
  (function init() {
    const params = new URLSearchParams(window.location.search);
    const urlPlan = String(params.get('plan') || '').toLowerCase();
    const urlInterval = params.get('interval') === 'year' ? 'year' : 'month';
    if (params.get('checkout') === 'canceled') canceledNotice.classList.add('show');

    state.interval = urlInterval;
    document.getElementById('int-month-btn').classList.toggle('active', urlInterval === 'month');
    document.getElementById('int-year-btn').classList.toggle('active', urlInterval === 'year');
    renderPlansGrid();

    if (PLANS[urlPlan]) {
      showConfirm(urlPlan);
    }
  })();
</script>
</body>
</html>
