<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="canonical" href="https://engine.you-the-winner.com/login" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Mel the Winner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a7d6f'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-weight='800' font-size='20' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  :root {
    --bg: #f0f5f3; --surface: #ffffff; --surface2: #e8f0ed;
    --border: #cfddd8; --text: #0f1f1c; --muted: #5a7a73;
    --soft: #a8c4bc; --accent: #2a7d6f; --accent2: #1a5c7a;
    --accent-light: #e0eeea; --error: #c0392b; --error-bg: #fdf0ef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 380px; }

  .monogram {
    width: 52px; height: 52px; border-radius: 14px;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; margin: 0 auto 20px;
  }
  .monogram span {
    font-family: 'Nunito', sans-serif; font-size: 1.6rem;
    font-weight: 800; color: white; line-height: 1;
  }
  .heading {
    font-family: 'Nunito', sans-serif; font-size: 1.5rem;
    font-weight: 800; text-align: center; margin-bottom: 4px;
  }
  .sub { font-size: 0.82rem; color: var(--muted); text-align: center; margin-bottom: 28px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 24px;
  }

  label {
    display: block; font-size: 0.72rem; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  input[type="email"], input[type="password"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px;
    font-family: 'Quicksand', sans-serif; font-size: 0.92rem;
    color: var(--text); outline: none; transition: border 0.2s;
    margin-bottom: 16px;
  }
  input:focus { border-color: var(--accent); background: #fff; }
  input::placeholder { color: var(--soft); }

  .btn {
    width: 100%; background: var(--accent); color: white;
    border: none; border-radius: 10px; padding: 13px;
    font-family: 'Nunito', sans-serif; font-size: 0.95rem;
    font-weight: 700; cursor: pointer; transition: all 0.2s;
    margin-top: 4px;
  }
  .btn:hover { background: var(--accent2); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .error-box {
    background: var(--error-bg); border: 1px solid #f5c6c4;
    border-radius: 10px; padding: 10px 14px;
    font-size: 0.82rem; color: var(--error);
    margin-bottom: 14px; display: none;
  }
  .error-box.show { display: block; }

  .footer-note {
    text-align: center; font-size: 0.72rem; color: var(--soft);
    margin-top: 20px; letter-spacing: 0.5px;
  }

  .signed-in-text {
    text-align: center; font-size: 0.88rem; color: var(--text);
    margin-bottom: 16px;
  }

  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0; font-size: 0.72rem; color: var(--soft);
    text-transform: uppercase; letter-spacing: 1.5px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .google-btn {
    width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    font-family: 'Quicksand', sans-serif; font-size: 0.92rem; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .google-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .google-btn img { width: 18px; height: 18px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
</style>
<!-- Google Analytics (Engine/Tools) -->
<script type="module">
  import { CLIENT } from "./client.config.js";
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  var gaScript = document.createElement("script");
  gaScript.async = true;
  gaScript.src = "https://www.googletagmanager.com/gtag/js?id=" + CLIENT.toolsAnalyticsId;
  document.head.appendChild(gaScript);
  gtag("js", new Date());
  gtag("config", CLIENT.toolsAnalyticsId);
</script>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
<div class="wrap">
  <div class="monogram"><span>M</span></div>
  <div class="heading">Sign in</div>
  <p class="sub">You-The-Winner Engine &nbsp;·&nbsp; private access</p>

  <div class="card" id="login-card">
    <div class="error-box" id="error-box"></div>
    <p class="footer-note" id="try-different-account" style="margin-top:0; margin-bottom:10px; cursor:pointer; text-decoration:underline; display:none;" onclick="signInWithDifferentAccount()">Choose a different Google account</p>

    <button class="google-btn" id="google-btn" onclick="signInWithGoogle()">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' width='18' height='18'%3E%3Cpath fill='%23FFC107' d='M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z'/%3E%3Cpath fill='%23FF3D00' d='M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z'/%3E%3Cpath fill='%234CAF50' d='M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z'/%3E%3Cpath fill='%231976D2' d='M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z'/%3E%3C/svg%3E" alt="" />
      <span id="google-btn-label">Continue with Google</span>
    </button>
    <p class="footer-note" id="popup-fallback" style="margin-top:14px; cursor:pointer; text-decoration:underline; display:none;" onclick="signInWithGoogle()">Trouble signing in? Try this instead</p>
  </div>

  <div class="card" id="signed-in-card" style="display:none;">
    <p class="signed-in-text">Signed in as <strong id="signed-in-email"></strong></p>
    <button class="btn" id="continue-btn" onclick="continueToSite()">Continue to site</button>
    <button class="google-btn" id="signout-btn" style="margin-top:10px;" onclick="signOutNow()">Sign out</button>
  </div>

  <p class="footer-note">Sign in with Google to get started.</p>
  <p class="footer-note" style="margin-top:10px;">By signing in you agree to our <a href="terms.html" style="color:var(--accent,#2a7d6f);text-decoration:underline;">Terms of Service</a>.</p>
  <p class="footer-note" id="debug-info" style="margin-top:6px; word-break:break-word;"></p>
</div>

<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, setPersistence, browserLocalPersistence }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { CLIENT } from "./client.config.js";

  // Always-allowed admin email (bypasses the denylist check below)
  const ADMIN_EMAIL = CLIENT.primaryAdminEmail;

  const FB_CONFIG = CLIENT.firebase;

  const app  = getApps().find(a => a.name === 'guard') || initializeApp(FB_CONFIG, 'guard');
  const auth = getAuth(app);
  const db   = getDatabase(app);

  const errorBox    = document.getElementById('error-box');
  const loginCard   = document.getElementById('login-card');
  const signedCard  = document.getElementById('signed-in-card');
  const signedEmail = document.getElementById('signed-in-email');
  const googleBtn   = document.getElementById('google-btn');
  const debugInfo   = document.getElementById('debug-info');
  const tryDifferentLink = document.getElementById('try-different-account');

  // Make sure sign-in state survives the full-page redirect on mobile.
  try { await setPersistence(auth, browserLocalPersistence); } catch (e) {
    console.warn('[login] setPersistence failed:', e);
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function hideError() {
    errorBox.classList.remove('show');
    errorBox.textContent = '';
    if (tryDifferentLink) tryDifferentLink.style.display = 'none';
  }
  function setDebug(msg) {
    if (debugInfo) debugInfo.textContent = msg;
  }

  function getReturnPath() {
    const params = new URLSearchParams(window.location.search);
    return params.get('return') || '/index.html';
  }

  // Shared post-sign-in check.
  // 2026-08-01 fix: this used to require the account already be a member of
  // some Firebase usergroup — i.e. an ALLOWLIST, deny-by-default. That
  // directly contradicted auth-guard.js's documented, intended policy for
  // every other page in the site (see its isDenylisted() comment): "any
  // brand-new Google sign-in is allowed by default; the denylist is the only
  // mechanism for cutting someone off." A real new subscriber signing in
  // with a fresh email — not yet in any usergroup, because nobody manually
  // added them — was being rejected with "not on the access list" here even
  // though every other page would have let them in. Rewritten to use the
  // exact same denylist-only check as auth-guard.js's isDenylisted(): allow
  // everyone through except accounts explicitly listed at
  // CLIENT.dbRootPath + '/denylist' (managed from Admin Settings -> Access
  // Denylist, no code changes needed to add/remove someone).
  // Returns true if the user is allowed and redirect should proceed.
  async function handleSignedInResult(result) {
    const email = (result.user.email || '').toLowerCase();
    // Admin always allowed
    if (email === ADMIN_EMAIL) return true;
    try {
      const snap = await get(ref(db, CLIENT.dbRootPath + '/denylist'));
      const list = snap.val();
      const denied = Array.isArray(list) && list.map(function(e){ return String(e).toLowerCase(); }).includes(email);
      if (denied) {
        await signOut(auth);
        showError("This account doesn't have access. Contact the site owner if you think this is a mistake.");
        if (tryDifferentLink) tryDifferentLink.style.display = 'block';
        return false;
      }
      return true;
    } catch(e) {
      // If Firebase read fails, fall back to blocking (fail-safe) — same
      // fail-closed behavior as before, just on a read that almost never
      // actually blocks anyone once it succeeds.
      await signOut(auth);
      showError("Could not verify access. Check your connection and try again.");
      return false;
    }
  }

function describeSignInError(err) {
    const code = err && err.code ? err.code : '';
    if (code === 'auth/unauthorized-domain') {
      return "This site isn't authorized for sign-in yet. Contact the site owner.";
    }
    if (code === 'auth/popup-blocked') {
      return 'Your browser blocked the sign-in popup. Try the link below.';
    }
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
      return 'Sign-in was closed before finishing. Please try again.';
    }
    if (code === 'auth/network-request-failed') {
      return 'Network error — check your connection and try again.';
    }
    if (code === 'auth/too-many-requests') {
      return 'Too many attempts. Please wait a moment and try again.';
    }
    if (code === 'auth/user-disabled') {
      return 'This account has been disabled. Contact the site owner.';
    }
    return 'Sign-in failed. Please try again.';
  }

  function setLoading(isLoading) {
    googleBtn.disabled = isLoading;
    const label = document.getElementById('google-btn-label');
    if (label) label.innerHTML = isLoading ? '<span class="spinner"></span>Signing in…' : 'Continue with Google';
  }

  // Main entry point (Google button).
  // Uses signInWithPopup on all devices — this is the most reliable flow on
  // modern iOS Safari and Android Chrome. The old redirect flow broke on iOS 17+
  // because Apple's ITP blocks the third-party cookies Firebase needs to pass
  // state back from firebaseapp.com after the redirect.
  // If the popup itself is blocked (some browsers do this), we fall back to redirect.
  //
  // 2026-08-30 postmortem: this used to unconditionally call
  // provider.setCustomParameters({ prompt: 'select_account' }) here, added
  // per Marcelo so a denied account wouldn't be stuck reusing itself with
  // no way to switch. That broke sign-in outright ("cannot login at all
  // ... even after cleaning cookies") -- forcing the account-chooser UI to
  // render and wait on a manual click keeps the popup open longer and
  // adds a real interaction step inside it, which is exactly the kind of
  // thing that can trip auth/popup-blocked partway through -- and the
  // redirect fallback right below is the same flow already called out
  // above as broken on iOS 17+ Safari, so once that happened there was no
  // way back in at all. Reverted: the default path here is back to
  // exactly its original, proven-working, no-forced-prompt behavior.
  // "Choose a different account" now lives only in
  // window.signInWithDifferentAccount below, surfaced as an explicit link
  // that appears after a denial (see handleSignedInResult) instead of
  // being baked into every sign-in attempt.
  async function doGoogleSignIn(forceAccountPicker) {
    hideError();
    setLoading(true);
    const provider = new GoogleAuthProvider();
    if (forceAccountPicker) provider.setCustomParameters({ prompt: 'select_account' });
    try {
      const result = await signInWithPopup(auth, provider);
      const ok = await handleSignedInResult(result);
      setLoading(false);
      if (ok) { window.location.href = getReturnPath(); return; }
    } catch (err) {
      console.warn('[login] sign-in error:', err);
      setLoading(false);
      if (err && err.code === 'auth/popup-blocked') {
        // Popup blocked — fall back to redirect flow
        try {
          await signInWithRedirect(auth, provider);
          // Page navigates away; result picked up by getRedirectResult below
        } catch (redirectErr) {
          showError(describeSignInError(redirectErr));
        }
      } else {
        showError(describeSignInError(err));
      }
    }
  }
  window.signInWithGoogle = function() { return doGoogleSignIn(false); };
  // Only reachable from the "Choose a different account" link, which only
  // appears after a denied sign-in -- see handleSignedInResult's denied
  // branch above. Isolated here so this is the ONLY path that ever forces
  // the account picker; the default button above never does.
  window.signInWithDifferentAccount = function() { return doGoogleSignIn(true); };

  window.continueToSite = function() {
    window.location.href = getReturnPath();
  };

  window.signOutNow = async function() {
    try { await signOut(auth); } catch (e) {}
  };

  // Pick up the result of a redirect-based sign-in (mobile flow), if any.
  (async () => {
    try {
      const result = await getRedirectResult(auth);
      if (result) {
        const ok = await handleSignedInResult(result);
        if (ok) { window.location.href = getReturnPath(); return; }
      }
    } catch (err) {
      console.warn('[login] redirect result error:', err);
      showError(describeSignInError(err));
    } finally {
      setLoading(false);
    }
  })();

  // Reflect current auth state in the UI.
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginCard.style.display  = 'none';
      signedCard.style.display = 'block';
      signedEmail.textContent  = user.email || '';
    } else {
      loginCard.style.display  = 'block';
      signedCard.style.display = 'none';
    }
  });
</script>
</body>
</html>
